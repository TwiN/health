name: test
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.22
      - uses: actions/checkout@v7
      - name: Benchmark
        run: go test -bench . -race
      - name: Test (race)
        run: go test -mod vendor ./... -race
      - name: Test (coverage)
        run: go test -mod vendor ./... -covermode=atomic
